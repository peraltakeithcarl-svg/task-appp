<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Task App</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--text:#1f2328;--muted:#6b7280;--accent:#4f46e5;--accent-text:#fff;--border:#e5e7eb;--danger:#dc2626;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15161a;--card:#1f2127;--text:#eceef2;--muted:#9aa1ad;--accent:#818cf8;--accent-text:#15161a;--border:#33363f;--danger:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15161a;--card:#1f2127;--text:#eceef2;--muted:#9aa1ad;--accent:#818cf8;--accent-text:#15161a;--border:#33363f;--danger:#f87171;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:24px 16px}
.app{width:100%;max-width:480px}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px;font-size:.95rem}
.add{display:flex;gap:8px;margin-bottom:16px}
input[type=text]{flex:1;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font-size:1rem;min-width:0}
button{cursor:pointer;font:inherit}
.btn{background:var(--accent);color:var(--accent-text);border:0;border-radius:10px;padding:12px 18px;font-weight:600}
.filters{display:flex;gap:6px;margin-bottom:12px}
.filters button{flex:1;padding:8px;border:1px solid var(--border);background:var(--card);color:var(--muted);border-radius:8px}
.filters button.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
li input{width:20px;height:20px;accent-color:var(--accent)}
li span{flex:1;word-break:break-word}
li.done span{text-decoration:line-through;color:var(--muted)}
.del{background:none;border:0;color:var(--danger);font-size:1.2rem;padding:4px 8px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:var(--muted);font-size:.9rem}
.foot button{background:none;border:0;color:var(--muted);text-decoration:underline}
.empty{text-align:center;color:var(--muted);padding:28px 0}
.due-row{display:flex;gap:8px;align-items:center;margin:-8px 0 14px;color:var(--muted);font-size:.9rem}
.due-row input{flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font:inherit;min-width:0}
.notif{width:100%;margin-bottom:14px;padding:9px;border:1px dashed var(--border);background:none;color:var(--muted);border-radius:8px}
li small.due{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
li small.due.late{color:var(--danger)}
#toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:20;padding:0 16px}
.toast{background:var(--accent);color:var(--accent-text);padding:12px 16px;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:480px;width:100%;font-weight:600}
</style>
</head>
<body>
<div class="app">
  <h1>My Tasks</h1>
  <p class="sub">Add a task, tick it off, and it’s saved on this device.</p>
  <div class="add">
    <input id="in" type="text" placeholder="What needs doing?" aria-label="New task">
    <button class="btn" id="addBtn">Add</button>
  </div>
  <div class="due-row"><label for="due">Remind me at</label><input id="due" type="datetime-local"></div>
  <button class="notif" id="notifBtn">🔔 Enable notifications</button>
  <div id="toasts" aria-live="polite"></div>
  <div class="filters" id="filters">
    <button data-f="all" class="on">All</button>
    <button data-f="active">Active</button>
    <button data-f="done">Done</button>
  </div>
  <ul id="list"></ul>
  <div class="foot"><span id="count"></span><button id="clear">Clear completed</button></div>
</div>
<script>
let tasks = [], filter = "all";
const KEY = "task-app:tasks";
const $ = id => document.getElementById(id);

try { tasks = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { tasks = []; }
if (!Array.isArray(tasks)) tasks = [];

function save() { try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch (e) {} }

function render() {
  const list = $("list");
  list.innerHTML = "";
  const shown = tasks.filter(t => filter === "all" || (filter === "done" ? t.done : !t.done));
  if (!shown.length) {
    const p = document.createElement("div");
    p.className = "empty";
    p.textContent = tasks.length ? "Nothing here." : "No tasks yet. Add your first one!";
    list.appendChild(p);
  }
  shown.forEach(t => {
    const li = document.createElement("li");
    if (t.done) li.className = "done";
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = t.done;
    cb.onchange = () => { t.done = cb.checked; save(); render(); };
    const sp = document.createElement("span");
    sp.textContent = t.text;
    if (t.due) {
      const s = document.createElement("small");
      s.className = "due" + (!t.done && t.due < Date.now() ? " late" : "");
      s.textContent = "⏰ " + new Date(t.due).toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
      sp.appendChild(s);
    }
    const d = document.createElement("button");
    d.className = "del"; d.textContent = "✕"; d.setAttribute("aria-label", "Delete task");
    d.onclick = () => { tasks = tasks.filter(x => x.id !== t.id); save(); render(); };
    li.append(cb, sp, d);
    list.appendChild(li);
  });
  const left = tasks.filter(t => !t.done).length;
  $("count").textContent = left + (left === 1 ? " task left" : " tasks left");
}

function add() {
  const text = $("in").value.trim();
  if (!text) return;
  const dv = $("due").value;
  tasks.unshift({ id: Date.now(), text, done: false, due: dv ? new Date(dv).getTime() : null, notified: false });
  $("due").value = nowLocal();
  $("in").value = "";
  save(); render();
}

$("addBtn").onclick = add;
$("in").addEventListener("keydown", e => { if (e.key === "Enter") add(); });
$("clear").onclick = () => { tasks = tasks.filter(t => !t.done); save(); render(); };
$("filters").onclick = e => {
  const f = e.target.dataset.f;
  if (!f) return;
  filter = f;
  document.querySelectorAll("#filters button").forEach(b => b.classList.toggle("on", b.dataset.f === f));
  render();
};
function toast(msg) {
  const d = document.createElement("div");
  d.className = "toast";
  d.textContent = msg;
  $("toasts").appendChild(d);
  setTimeout(() => d.remove(), 8000);
}

function notifState() {
  const b = $("notifBtn");
  if (!("Notification" in window)) { b.textContent = "In-app reminders only"; b.disabled = true; return; }
  const p = Notification.permission;
  b.textContent = p === "granted" ? "🔔 Notifications on" : p === "denied" ? "🔕 Blocked in browser settings" : "🔔 Enable notifications";
}

$("notifBtn").onclick = async () => {
  try { if ("Notification" in window && Notification.permission === "default") await Notification.requestPermission(); } catch (e) {}
  notifState();
};

function check() {
  const now = Date.now();
  let changed = false;
  tasks.forEach(t => {
    if (t.due && !t.done && !t.notified && t.due <= now) {
      t.notified = true;
      changed = true;
      toast("⏰ Reminder: " + t.text);
      try {
        if ("Notification" in window && Notification.permission === "granted") new Notification("Task reminder", { body: t.text });
      } catch (e) {}
    }
  });
  if (changed) { save(); render(); }
}

function nowLocal() {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 16);
}
$("due").value = nowLocal();

setInterval(check, 15000);
notifState();
render();
check();
</script>
</body>
</html>
